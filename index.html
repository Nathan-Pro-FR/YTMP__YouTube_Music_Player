<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>YT Music - Player 1000+ Tracks & Visualizer</title>

  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #060608;
      --card-bg: rgba(18, 18, 24, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #ff0033;
      --accent-glow: rgba(255, 0, 51, 0.5);
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Canvas d'arrière-plan réactif à l'amplitude */
    #visualizer-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0.85;
    }

    /* En-tête / Navbar */
    header {
      width: 100%;
      max-width: 1400px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .brand i {
      color: var(--accent-color);
      font-size: 1.6rem;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .playlist-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      max-width: 100%;
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--text-main);
      color: #000;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    /* Disposition Grille Principale (Responsive) */
    main {
      width: 100%;
      max-width: 1400px;
      padding: 10px 20px 30px;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr 420px;
      gap: 20px;
    }

    /* Colonne Lecteur */
    .player-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* Ratio 16:9 */
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      border: 1px solid var(--border-color);
    }

    #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; /* Masque les clics iframe */
    }

    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .track-meta-now {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cover-art {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      flex-shrink: 0;
    }

    .song-details {
      overflow: hidden;
    }

    .song-details h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-details p {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Barre de progression */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 40px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn.play-btn {
      background: var(--accent-color);
      width: 52px;
      height: 52px;
      font-size: 1.2rem;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .ctrl-btn.active-mode {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
    }

    /* Colonne Tracklist (1000+ titres) */
    .tracklist-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px;
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      height: calc(100vh - 110px);
      max-height: 780px;
    }

    .tracklist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      gap: 10px;
    }

    .tracklist-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .tracklist-header span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Barre de Recherche pour les 1000 titres */
    .search-box {
      margin: 12px 0;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 8px;
    }

    .search-box i {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.85rem;
      width: 100%;
    }

    .tracklist {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      flex: 1;
    }

    .tracklist::-webkit-scrollbar {
      width: 5px;
    }

    .tracklist::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .track-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .track-item.active {
      background: rgba(255, 0, 51, 0.15);
      border: 1px solid rgba(255, 0, 51, 0.3);
    }

    .track-num {
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 24px;
      text-align: center;
      flex-shrink: 0;
    }

    .track-item.active .track-num {
      color: var(--accent-color);
      font-weight: bold;
    }

    .track-thumb {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      overflow: hidden;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .track-item.active .track-title {
      color: var(--accent-color);
    }

    .track-duration {
      font-size: 0.75rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .input-box {
      margin-top: 10px;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .input-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 6px 12px;
      font-size: 0.8rem;
      width: 100%;
    }

    .input-box button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Adaptation Mobile / Écran Tablette (Responsive Breakpoints) */
    @media (max-width: 992px) {
      main {
        grid-template-columns: 1fr;
      }
      .tracklist-card {
        height: 480px;
        position: static;
      }
      header {
        justify-content: center;
      }
    }

    @media (max-width: 576px) {
      header {
        padding: 12px 15px;
      }
      main {
        padding: 5px 12px 25px;
      }
      .controls-card {
        padding: 15px;
      }
      .action-bar {
        justify-content: center;
      }
      .volume-container {
        width: 100%;
        justify-content: center;
        margin-top: 5px;
      }
    }
  </style>
</head>
<body>

  <!-- Visualiseur Canvas Réactif d'Amplitude -->
  <canvas id="visualizer-canvas"></canvas>

  <header>
    <div class="brand">
      <i class="fa-brands fa-youtube"></i>
      <span>YTMP - YT Music Player</span>
    </div>

    <div class="playlist-tabs">
      <button class="tab-btn active" onclick="switchPlaylist('PLe6uecFqdHnZjeHOT-uBDj0OKjmSgGsdt', this)">
        🔥 Sélection (1k)
      </button>
      <button class="tab-btn" onclick="switchPlaylist('PLMC9KNkIncKtPzgY-5rmhvj7fax8fdxoj', this)">
        🎧 Hits Pop
      </button>
    </div>
  </header>

  <main>
    <!-- Zone Lecteur & Commandes -->
    <section class="player-section">
      <div class="video-container">
        <div id="player"></div>
      </div>

      <div class="controls-card">
        <div class="track-meta-now">
          <img id="cover-art" class="cover-art" src="https://via.placeholder.com/60" alt="Pochette">
          <div class="song-details">
            <h2 id="song-title">Chargement des 1 000 titres...</h2>
            <p id="song-artist">Veuillez patienter...</p>
          </div>
        </div>

        <div class="progress-container">
          <span id="time-current" class="time-label">0:00</span>
          <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0" oninput="seekTo(this.value)">
          <span id="time-total" class="time-label">0:00</span>
        </div>

        <div class="action-bar">
          <div class="playback-buttons">
            <button class="ctrl-btn" onclick="prevTrack()" title="Précédent">
              <i class="fa-solid fa-backward-step"></i>
            </button>
            <button class="ctrl-btn play-btn" id="play-pause-btn" onclick="togglePlay()" title="Lecture/Pause">
              <i class="fa-solid fa-play"></i>
            </button>
            <button class="ctrl-btn" onclick="nextTrack()" title="Suivant">
              <i class="fa-solid fa-forward-step"></i>
            </button>
            <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Lecture Aléatoire">
              <i class="fa-solid fa-shuffle"></i>
            </button>
          </div>

          <div class="volume-container">
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" class="volume-slider" min="0" max="100" value="100" oninput="setVolume(this.value)">
          </div>
        </div>
      </div>
    </section>

    <!-- Zone Tracklist (1000 morceaux) -->
    <section class="tracklist-card">
      <div class="tracklist-header">
        <h3>Tracklist</h3>
        <span id="track-count">0 titres</span>
      </div>

      <!-- Barre de recherche -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Rechercher parmi les 1 000 morceaux..." oninput="filterTracklist()">
      </div>

      <ul id="tracklist-container" class="tracklist">
        <!-- Titres générés dynamiquement -->
      </ul>

      <div class="input-box">
        <input type="text" id="playlist-url-input" placeholder="Autre lien/ID de playlist...">
        <button onclick="loadCustomPlaylist()">Charger</button>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let isPlaying = false;
    let isShuffle = false;
    let progressTimer = null;
    let currentPlaylistTracks = [];
    let currentTrackIndex = 0;
    let activePlaylistId = 'PLe6uecFqdHnZjeHOT-uBDj0OKjmSgGsdt';

    // -------------------------------------------------------------
    // 1. VISUALISEUR D'AMPLITUDE EN CANVAS (ARRIÈRE-PLAN ANIMÉ)
    // -------------------------------------------------------------
    const canvas = document.getElementById('visualizer-canvas');
    const ctx = canvas.getContext('2d');
    let animFrame;
    let audioPhase = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderAudioVisualizer() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.35;
      
      // Simulation d'amplitude réactive basée sur la lecture
      const amplitude = isPlaying ? (Math.sin(audioPhase * 3) * 0.4 + 0.6) : 0.15;
      const pulseRadius = 180 + amplitude * 120;

      // Halo Lumineux réactif
      const gradient = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, pulseRadius * 2);
      gradient.addColorStop(0, `rgba(255, 0, 51, ${0.25 * amplitude})`);
      gradient.addColorStop(0.5, `rgba(120, 0, 40, ${0.12 * amplitude})`);
      gradient.addColorStop(1, 'rgba(6, 6, 8, 0)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Onde de spectre d'amplitude au bas de l'écran
      const bars = 60;
      const barWidth = canvas.width / bars;

      for (let i = 0; i < bars; i++) {
        const heightMultiplier = isPlaying ? (Math.sin(audioPhase * 2 + i * 0.2) * 0.5 + 0.5) : 0.05;
        const barHeight = heightMultiplier * 80 * amplitude + 5;

        ctx.fillStyle = `rgba(255, 0, 51, ${0.15 + heightMultiplier * 0.3})`;
        ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
      }

      if (isPlaying) audioPhase += 0.03;
      animFrame = requestAnimationFrame(renderAudioVisualizer);
    }
    renderAudioVisualizer();

    // -------------------------------------------------------------
    // 2. RÉCUPÉRATION DES 1000 TITRES (API MIROIR DE RÉSEAU)
    // -------------------------------------------------------------
    async function fetchFullPlaylist(playlistId) {
      const apiMirrors = [
        `https://pipedapi.kavin.rocks/playlists/${playlistId}`,
        `https://api.piped.video/playlists/${playlistId}`,
        `https://inv.nadeko.net/api/v1/playlists/${playlistId}`,
        `https://invidious.nerdvpn.de/api/v1/playlists/${playlistId}`
      ];

      for (const url of apiMirrors) {
        try {
          const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
          if (!res.ok) continue;
          const data = await res.json();

          // Format Piped
          if (data.relatedStreams && data.relatedStreams.length > 0) {
            return data.relatedStreams.map(item => ({
              id: item.url.replace('/watch?v=', ''),
              title: item.title,
              artist: item.uploaderName || 'Artiste YouTube',
              duration: item.duration > 0 ? formatTime(item.duration) : '--:--',
              thumbnail: item.thumbnail || `https://img.youtube.com/vi/${item.url.replace('/watch?v=', '')}/mqdefault.jpg`
            }));
          }

          // Format Invidious
          if (data.videos && data.videos.length > 0) {
            return data.videos.map(item => ({
              id: item.videoId,
              title: item.title,
              artist: item.author || 'Artiste YouTube',
              duration: item.lengthSeconds > 0 ? formatTime(item.lengthSeconds) : '--:--',
              thumbnail: item.videoThumbnails?.[0]?.url || `https://img.youtube.com/vi/${item.videoId}/mqdefault.jpg`
            }));
          }
        } catch (e) {
          console.warn('Essai du miroir suivant...', e);
        }
      }
      return null;
    }

    // -------------------------------------------------------------
    // 3. INITIALISATION DU LECTEUR YOUTUBE
    // -------------------------------------------------------------
    function onYouTubeIframeAPIReady() {
      const currentOrigin = (window.location.origin && window.location.origin !== 'null') 
        ? window.location.origin 
        : 'https://www.youtube.com';

      player = new YT.Player('player', {
        host: 'https://www.youtube.com',
        playerVars: {
          listType: 'playlist',
          list: activePlaylistId,
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          modestbranding: 1,
          rel: 0,
          origin: currentOrigin
        },
        events: {
          'onStateChange': onPlayerStateChange,
          'onReady': () => loadPlaylistMetadata(activePlaylistId)
        }
      });
    }

    async function loadPlaylistMetadata(playlistId) {
      document.getElementById('song-title').textContent = "Chargement des 1 000 titres...";
      document.getElementById('song-artist').textContent = "Interrogation du serveur...";

      const tracks = await fetchFullPlaylist(playlistId);

      if (tracks && tracks.length > 0) {
        currentPlaylistTracks = tracks;
      } else {
        // Fallback si l'API miroir ne répond pas
        const ids = player.getPlaylist() || [];
        currentPlaylistTracks = ids.map((id, index) => ({
          id: id,
          title: `Titre #${index + 1}`,
          artist: "YouTube Track",
          duration: "--:--",
          thumbnail: `https://img.youtube.com/vi/${id}/mqdefault.jpg`
        }));
      }

      renderTracklist();
      updateNowPlayingInfo();
    }

    function renderTracklist(filterText = '') {
      const container = document.getElementById('tracklist-container');
      container.innerHTML = '';

      const filtered = currentPlaylistTracks.filter(t => 
        t.title.toLowerCase().includes(filterText) || t.artist.toLowerCase().includes(filterText)
      );

      document.getElementById('track-count').textContent = `${filtered.length} titres`;

      filtered.forEach((track, index) => {
        const originalIndex = currentPlaylistTracks.indexOf(track);
        const li = document.createElement('li');
        li.className = `track-item ${originalIndex === currentTrackIndex ? 'active' : ''}`;
        li.id = `track-item-${originalIndex}`;
        li.onclick = () => playTrackAtIndex(originalIndex);

        li.innerHTML = `
          <span class="track-num">${originalIndex + 1}</span>
          <img class="track-thumb" src="${track.thumbnail}" alt="thumb">
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
          <div class="track-duration">${track.duration}</div>
        `;
        container.appendChild(li);
      });
    }

    function filterTracklist() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      renderTracklist(query);
    }

    function playTrackAtIndex(index) {
      currentTrackIndex = index;
      const track = currentPlaylistTracks[index];

      if (track) {
        player.loadVideoById(track.id);
        updateNowPlayingInfo();
        renderTracklist(document.getElementById('search-input').value.toLowerCase());
      }
    }

    function onPlayerStateChange(event) {
      const playIcon = document.querySelector('#play-pause-btn i');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause';
        startProgressLoop();
        
        // Sync de l'index réel de YouTube
        if (player.getPlaylistIndex) {
          const idx = player.getPlaylistIndex();
          if (idx !== -1 && idx !== currentTrackIndex) {
            currentTrackIndex = idx;
            renderTracklist();
          }
        }
        updateNowPlayingInfo();
      } else {
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play';
        stopProgressLoop();
      }
    }

    function updateNowPlayingInfo() {
      if (currentPlaylistTracks.length === 0) return;

      const track = currentPlaylistTracks[currentTrackIndex] || currentPlaylistTracks[0];
      const ytData = player.getVideoData ? player.getVideoData() : null;

      const title = (ytData && ytData.title) ? ytData.title : track.title;
      const artist = (ytData && ytData.author) ? ytData.author : track.artist;

      document.getElementById('song-title').textContent = title;
      document.getElementById('song-artist').textContent = artist;
      document.getElementById('cover-art').src = track.thumbnail;

      // Défilement automatique vers le morceau actif
      const activeEl = document.getElementById(`track-item-${currentTrackIndex}`);
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // -------------------------------------------------------------
    // 4. BOUCLE DE PROGRESSION & CONTRÔLES
    // -------------------------------------------------------------
    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (!player || !player.getCurrentTime) return;

        const current = player.getCurrentTime() || 0;
        const total = player.getDuration() || 0;

        if (total > 0) {
          const percentage = (current / total) * 100;
          document.getElementById('progress-bar').value = percentage;
          document.getElementById('time-current').textContent = formatTime(current);
          document.getElementById('time-total').textContent = formatTime(total);
        }
      }, 500);
    }

    function stopProgressLoop() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function seekTo(percentage) {
      if (!player || !player.getDuration) return;
      const total = player.getDuration();
      player.seekTo((percentage / 100) * total, true);
    }

    function formatTime(seconds) {
      const sec = Math.floor(seconds);
      const min = Math.floor(sec / 60);
      const remSec = sec % 60;
      return `${min}:${remSec < 10 ? '0' : ''}${remSec}`;
    }

    function togglePlay() {
      if (!player) return;
      isPlaying ? player.pauseVideo() : player.playVideo();
    }

    function nextTrack() {
      if (currentTrackIndex + 1 < currentPlaylistTracks.length) {
        playTrackAtIndex(currentTrackIndex + 1);
      } else {
        playTrackAtIndex(0);
      }
    }

    function prevTrack() {
      if (currentTrackIndex - 1 >= 0) {
        playTrackAtIndex(currentTrackIndex - 1);
      } else {
        playTrackAtIndex(currentPlaylistTracks.length - 1);
      }
    }

    function toggleShuffle() {
      if (!player) return;
      isShuffle = !isShuffle;
      player.setShuffle(isShuffle);
      document.getElementById('shuffle-btn').classList.toggle('active-mode', isShuffle);
    }

    function setVolume(val) {
      if (player && player.setVolume) player.setVolume(val);
    }

    function switchPlaylist(playlistId, buttonEl) {
      if (buttonEl) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        buttonEl.classList.add('active');
      }

      activePlaylistId = playlistId;
      currentTrackIndex = 0;

      if (player && player.loadPlaylist) {
        player.loadPlaylist({ listType: 'playlist', list: playlistId, index: 0 });
      }
      loadPlaylistMetadata(playlistId);
    }

    function loadCustomPlaylist() {
      const input = document.getElementById('playlist-url-input').value.trim();
      if (!input) return;

      let playlistId = input;
      if (input.includes('list=')) {
        const urlParams = new URLSearchParams(input.split('?')[1] || input.split('&')[0]);
        playlistId = urlParams.get('list');
      }

      if (playlistId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        switchPlaylist(playlistId, null);
        document.getElementById('playlist-url-input').value = '';
      } else {
        alert("ID de playlist invalide.");
      }
    }
  </script>
</body>
</html>
